<header id="header" class="header fixed-top">
  <div class="topbar d-flex align-items-center dark-background">
    <div class="container d-flex justify-content-center justify-content-md-between">
      <div class="contact-info d-flex align-items-center">
        <i class="bi bi-envelope d-flex align-items-center"><a href="mailto:contact@example.com">contact@example.com</a></i>
        <i class="bi bi-phone d-flex align-items-center ms-4"><span>+1 5589 55488 55</span></i>
      </div>
      <div class="social-links d-none d-md-flex align-items-center">
        <a href="#" class="twitter"><i class="bi bi-twitter-x"></i></a>
        <a href="#" class="facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" class="instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" class="linkedin"><i class="bi bi-linkedin"></i></a>
        <app-language-switcher class="ms-3" />
      </div>
    </div>
  </div>

  <div class="branding d-flex align-items-center">
    <div class="container position-relative d-flex align-items-center justify-content-between">
      <a routerLink="/" class="logo d-flex align-items-center">
        <h1 class="sitename">NeuroAssist</h1>
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          @for (item of menuItems(); track item.path) {
            <li>
              <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }" (click)="closeMobileNav()">{{ i18n.t(item.labelKey) }}</a>
            </li>
          }

          @if (!auth.isLoggedIn()) {
            <li><a routerLink="/sign-in" routerLinkActive="active" (click)="closeMobileNav()">{{ i18n.t('nav.signIn') }}</a></li>
          } @else {
            <li class="dropdown">
              <a href="#" [class.active]="userMenuOpen()" (click)="toggleUserMenu($event)">
                <i class="bi bi-person-circle me-1"></i>
                <span>{{ auth.currentUser()?.prenom }}</span>
                <i class="bi bi-chevron-down toggle-dropdown"></i>
              </a>
              <ul [class.dropdown-active]="userMenuOpen()">
                <li><a href="#" (click)="logout(); $event.preventDefault()"><i class="bi bi-box-arrow-right"></i><span>{{ i18n.t('nav.logout') }}</span></a></li>
              </ul>
            </li>
          }
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi" [class.bi-list]="!mobileNavActive()" [class.bi-x]="mobileNavActive()" (click)="toggleMobileNav()"></i>
      </nav>
    </div>
  </div>
</header>
