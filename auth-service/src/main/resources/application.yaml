server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      # Same Atlas cluster as the other services, but its own database -
      # auth-service is the only thing allowed to touch this data directly.
      # users_db is the single source of truth for user accounts (doctors,
      # patients, admins) - previously scattered across auth_db/patient_db/
      # alzheimer_db leftovers from earlier architecture iterations; those
      # were consolidated here and the orphaned databases dropped.
      uri: mongodb+srv://nzouaghi15_db_user:Stendhal01%21@cluster0.5p2ews7.mongodb.net/users_db


  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

geofencing:
  # Left empty, alerts are recorded and logged instead of sent - the feature
  # stays fully testable without SMTP credentials.
  mail-from: ${GEOFENCING_MAIL_FROM:}
  # A GPS fix is worth 20-100 m; compared against radius + reported accuracy.
  accuracy-margin-meters: 30
  # watchPosition() fires every few seconds: without this, one walk outside
  # would send the relative hundreds of identical emails.
  alert-cooldown-minutes: 15

jwt:
  secret: alzheimer2025SecretKeyForJWTToken!
  expiration: 86400000


admin:
  default-email: ${ADMIN_EMAIL:admin@alzheimer.com}
  default-password: ${ADMIN_PASSWORD:Admin123!}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
